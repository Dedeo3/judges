services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: judges
      POSTGRES_PASSWORD: judges
      POSTGRES_DB: judges
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judges"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
